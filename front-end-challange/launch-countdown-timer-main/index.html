<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Launch countdown timer</title>
</head>

<body>
  <img src="images/bg-stars.svg" id="star" alt="stars">
  <img src="images/pattern-hills.svg" id="hill" alt="hills">
  <div class="container">
    <h2 >We're launching soon</h2>
    <div class="countdown" id="countdown">
      <div class="timebox">
        <div class="timer" id="days">00</div>
        <!-- <div class="timer" id="daysanimation">00</div> -->
        <span class="text">DAYS</span>
      </div>
      <div class="timebox">
        <div class="timer" id="hours">00</div>
        <!-- <div class="timer" id="hoursanimation">00</div> -->
        <span class="text">HOURS</span>
      </div>
      <div class="timebox">
        <div class="timer" id="minutes">00</div>
        <!-- <div class="timer" id="minutesanimation">00</div> -->
        <span class="text">MINUTES</span>
      </div>
      <div class="timebox">
        <div class="timer" id="seconds">00</div>
        <!-- <div class="timer" id="secondsanimation">00</div> -->
        <span class="text">SECONDS</span>
      </div>
    </div>
    <div class="links">
      <img src="images/icon-facebook.svg" alt="facebook">
      <img src="images/icon-pinterest.svg" alt="pinterest">
      <img src="images/icon-instagram.svg" alt="instagram">
    </div>
  </div>
 
  <script src="script.js"></script>
</body>

</html>
